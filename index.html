    <script>
      /* Place launcher beside hamburger (before .menu-toggle), never after the drawer */
      (function () {
        function place() {
          var chrome = document.getElementById('qira-apps-chrome');
          if (!chrome) return;
          var header =
            document.querySelector('header.topbar') ||
            document.querySelector('.topbar');
          if (!header) return;
          var slot = header.querySelector('.qira-apps-slot');
          if (!slot) {
            slot = document.createElement('div');
            slot.className = 'qira-apps-slot';
            slot.setAttribute('aria-label', 'Qira Apps');
          }
          var toggle = header.querySelector('.menu-toggle');
          if (slot.parentNode !== header || (toggle && slot.nextElementSibling !== toggle)) {
            if (toggle) header.insertBefore(slot, toggle);
            else header.appendChild(slot);
          }
          var home = slot.querySelector('.qira-home-link');
          if (!home) {
            home = document.createElement('a');
            home.className = 'qira-home-link';
            home.href = 'https://imagineqira.com/';
            home.title = 'Qira company site';
            home.textContent = 'Qira';
            home.style.cssText = 'font:600 12px/1 Inter,system-ui,sans-serif;color:#596273;text-decoration:none;letter-spacing:.04em;margin-right:6px;';
            slot.insertBefore(home, slot.firstChild);
          }
          if (chrome.parentNode !== slot) {
            slot.appendChild(chrome);
          }
          chrome.classList.add('is-in-header');
        }
        var tries = 0;
        var id = setInterval(function () {
          place();
          tries += 1;
          if (document.querySelector('header.topbar') || tries > 60) {
            place();
            if (tries > 60 || document.querySelector('header.topbar .menu-toggle')) clearInterval(id);
          }
        }, 80);
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', place);
        } else {
          place();
        }
        // Re-place after SPA re-renders the header
        try {
          var mo = new MutationObserver(function () { place(); });
          mo.observe(document.documentElement, { childList: true, subtree: true });
          setTimeout(function () { mo.disconnect(); }, 8000);
        } catch (e) {}
      })();
    </script>
    <!--
      Clean-URL restore for GitHub Pages. A hard load of /people is served by
      404.html, which redirects to /?/people (a real 200). This restores the
      clean path before the app boots, so the address bar reads /people and the
      status is 200 — no visible 404. See public/404.html.
    -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>

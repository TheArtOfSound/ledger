    <script>
      /* Portal mobile drawer + sync body class. Do NOT inject into React topbar. */
      (function () {
        function portalDrawer() {
          var header = document.querySelector('header.topbar') || document.querySelector('.topbar');
          if (!header) return false;
          var nav = header.querySelector('#mobile-nav') || header.querySelector('.mobile-nav');
          var backdrop = header.querySelector('.menu-backdrop');
          // Drop stale clones if React re-mounted the drawer inside the header
          var bodyNavs = document.querySelectorAll('body > #mobile-nav, body > .mobile-nav');
          var bodyBacks = document.querySelectorAll('body > .menu-backdrop');
          if (nav) {
            for (var i = 0; i < bodyNavs.length; i++) {
              if (bodyNavs[i] !== nav) bodyNavs[i].parentNode.removeChild(bodyNavs[i]);
            }
            if (nav.parentNode !== document.body) document.body.appendChild(nav);
          }
          if (backdrop) {
            for (var j = 0; j < bodyBacks.length; j++) {
              if (bodyBacks[j] !== backdrop) bodyBacks[j].parentNode.removeChild(bodyBacks[j]);
            }
            if (backdrop.parentNode !== document.body) document.body.appendChild(backdrop);
          }
          return true;
        }
        function syncOpen() {
          var header = document.querySelector('header.topbar') || document.querySelector('.topbar');
          var open = !!(header && header.classList.contains('is-menu-open'));
          document.body.classList.toggle('ledger-menu-open', open);
        }
        function tick() {
          portalDrawer();
          syncOpen();
        }
        var n = 0;
        var id = setInterval(function () {
          tick();
          n += 1;
          if (n > 80) clearInterval(id);
        }, 100);
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', tick);
        } else {
          tick();
        }
        try {
          var mo = new MutationObserver(function () { tick(); });
          mo.observe(document.documentElement, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ['class', 'aria-expanded', 'aria-hidden'],
          });
          // Keep observer: menu open/close toggles class on header
        } catch (e) {}
      })();
    </script>
    <!--
      Clean-URL restore for GitHub Pages. A hard load of /people is served by
      404.html, which redirects to /?/people (a real 200). This restores the
      clean path before the app boots, so the address bar reads /people and the
      status is 200 — no visible 404. See public/404.html.
    -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>

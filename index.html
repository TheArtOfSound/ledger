  <body>
    
    <div id="qira-apps-chrome" aria-label="Qira Apps">
      <qira-product-launcher current-product="ledger" theme="dark"></qira-product-launcher>
    </div>

    <div id="root"></div>
    <script>
      /* Move launcher into Ledger header as last control when present */
      (function () {
        function place() {
          var chrome = document.getElementById('qira-apps-chrome');
          if (!chrome) return;
          var header =
            document.querySelector('header.topbar') ||
            document.querySelector('.topbar') ||
            document.querySelector('header');
          if (!header) return;
          var slot = header.querySelector('.qira-apps-slot');
          if (!slot) {
            slot = document.createElement('div');
            slot.className = 'qira-apps-slot';
            slot.setAttribute('aria-label', 'Qira Apps');
            header.appendChild(slot);
          }
          if (chrome.parentNode !== slot) {
            slot.appendChild(chrome);
            chrome.classList.add('is-in-header');
          }
        }
        var tries = 0;
        var id = setInterval(function () {
          place();
          tries += 1;
          if (document.querySelector('header.topbar, .topbar') || tries > 40) {
            place();
            if (tries > 40) clearInterval(id);
            if (document.querySelector('header.topbar, .topbar')) clearInterval(id);
          }
        }, 100);
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', place);
        } else {
          place();
        }
      })();
    </script>
    <!--
      Clean-URL restore for GitHub Pages. A hard load of /people is served by
      404.html, which redirects to /?/people (a real 200). This restores the
      clean path before the app boots, so the address bar reads /people and the
      status is 200 — no visible 404. See public/404.html.
    -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>
  </body>
